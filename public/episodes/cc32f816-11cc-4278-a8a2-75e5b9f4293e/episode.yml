title: 'From HOA Management to $4B in Revenue & $6.3B Deal for Amex GBT: Alexander
  Taubman, Long Lake (David Senra)'
description: 'Alexander Taubman, co-founder and CEO of Long Lake, explains Long Lake''s
  $6.3 billion deal for American Express Global Business Travel, why deploying AI
  in the real economy is difficult, and how its Nexus AI platform connects models
  to business data and workflows. Source: https://www.youtube.com/watch?v=w3-nMklTFjY'
