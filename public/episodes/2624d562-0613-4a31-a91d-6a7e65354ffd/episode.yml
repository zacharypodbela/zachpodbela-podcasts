title: 'Stanford AI Club: Chamath on How to Win in the AI Era'
description: 'Chamath Palihapitiya, co-founder and CEO of 8090, speaks at the Stanford
  AI Club Speaker Series on how to win in the AI era. He discusses 8090''s AI-native
  software development platform, which rebuilds legacy enterprise systems at roughly
  80% feature completeness for 90% less cost by combining humans, AI agents, and automation
  into governed assembly lines that preserve institutional knowledge as living documentation.
  Source: https://www.youtube.com/watch?v=HBMmK0NsUK0'
